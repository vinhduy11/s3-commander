[package]
name = "s3-commander"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "s3_commander_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = "1.9.2"
base64 = "0.22"
thiserror = "2.0.21"
aws-sdk-s3 = "1.137.0"
aws-credential-types = "1.2.14"
aws-smithy-types = "1.5.0"
aws-smithy-runtime-api = "1.12.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
aws-smithy-mocks = "0.2.6"
aws-sdk-s3 = { version = "1.137.0", features = ["test-util"] }
tokio = { version = "1.54.1", features = ["rt", "macros"] }
tempfile = "3.27.0"
aws-smithy-http-client = { version = "1.1.13", features = ["test-util"] }
